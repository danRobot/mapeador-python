# -----------------------------------------------------------------------------
# Servicios externos (se dibujan como hojas del flujo, con su destino evaluado).
#
#   tipo        categoría que se muestra: HTTP, SOAP, BD, ARCHIVO, COLA, CORREO,
#               PROCESO, NUBE, CACHE, GRPC, SOCKET, FTP, SSH, LDAP...
#   nombre      nombre de la regla (aparece en el panel)
#   clases      dueño de la función: módulo o clase con nombre completo (comodines);
#               "builtins" para open(), "requests" para requests.get(...)
#   metodos     nombres de función o método ("*" = cualquiera)
#   destino     de dónde sale el destino: "arg:N", "kw:nombre", combinados con "|"
#               (el primero que exista), "receptor" (el objeto sobre el que se llama),
#               "metodo" (el nombre del método llamado)
#   verbo       "nombre" (GET/POST... del nombre del método), "arg:N", "kw:x",
#               "modo" (open: LEER/ESCRIBIR) o un texto fijo
#   sql         true: el destino es SQL; se muestra operación y tabla
#   requiere_sql  true: solo coincide si el primer argumento parece SQL
# -----------------------------------------------------------------------------
[[terminales]]
tipo = "HTTP"
nombre = "requests / httpx / aiohttp"
clases = ["requests", "requests.api", "requests.Session", "requests.sessions.Session", "httpx", "httpx.Client",
          "httpx.AsyncClient", "aiohttp.ClientSession", "aiohttp.client.ClientSession", "urllib3.PoolManager",
          "urllib3.HTTPConnectionPool", "niquests", "niquests.Session", "treq", "grequests"]
metodos = ["get", "post", "put", "delete", "patch", "head", "options"]
destino = "arg:0|kw:url"
verbo = "nombre"

