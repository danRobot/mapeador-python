# =============================================================================
# Configuración POR DEFECTO del mapeador Python.
#
# No edites este archivo: copia config/config.ejemplo.toml, cambia solo lo que
# necesites y pásalo con --config (o ponlo en config/ al usar Docker). La
# configuración del usuario se fusiona encima de esta así:
#   - las tablas se mezclan clave por clave;
#   - una lista del usuario REEMPLAZA la lista por defecto;
#   - una clave terminada en "_extra" se AGREGA a la lista del mismo nombre
#     (ej: terminales_extra agrega reglas a terminales).
# =============================================================================

[general]
# Carpetas que nunca se recorren (por nombre, en cualquier nivel; admite comodines).
directorios_excluidos = [
  ".git", ".hg", ".svn", ".idea", ".vscode", "__pycache__", ".mypy_cache", ".pytest_cache",
  ".ruff_cache", ".tox", ".nox", ".venv", "venv", "env", "virtualenv", ".virtualenv", "site-packages",
  "dist-packages", "node_modules", "build", "dist", ".eggs", "*.egg-info", "htmlcov", ".ipynb_checkpoints",
  "migrations", "docs", "doc", "_build",
]
# Pruebas: por defecto no se analizan (ensucian el grafo y las búsquedas de "main").
incluir_pruebas = false
directorios_pruebas = ["tests", "test", "testing", "pruebas", "test_data"]
archivos_pruebas = ["test_*.py", "*_test.py", "tests.py", "conftest.py"]
# Archivos más grandes que esto se omiten (KB).
tamano_maximo_archivo_kb = 2048
# Protección para carpetas enormes.
max_archivos = 20000

[analisis]
# Rondas de inferencia: en cada ronda los tipos que llegan a una función desde sus
# llamadas (p. ej. procesar(Pedido(...))) se usan para resolver lo que hay dentro.
rondas_inferencia = 3
# Si el receptor de una llamada no se puede tipar, enlazar con la única función o
# método del proyecto con ese nombre (confianza baja).
heuristica_nombre_unico = true
# Agregar como destino las sobrescrituras en subclases (self.validar() en una clase
# base llega también a Hija.validar). Confianza media.
polimorfismo = true
# Límites (protección contra uniones de tipos enormes).
max_tipos_por_expresion = 6
max_destinos_por_llamada = 12
# Nombres de métodos de str/list/dict/archivos/logging. Si el receptor no se pudo
# tipar y ningún método del proyecto se llama así, la llamada se marca como de
# librería (la interfaz las oculta por defecto) en vez de "no resuelta".
metodos_comunes = [
  "append", "extend", "insert", "pop", "popleft", "appendleft", "remove", "clear", "copy", "count", "index",
  "sort", "reverse", "get", "items", "keys", "values", "update", "setdefault", "add", "discard", "union",
  "intersection", "difference", "issubset", "split", "rsplit", "splitlines", "join", "strip", "lstrip",
  "rstrip", "replace", "format", "format_map", "lower", "upper", "title", "capitalize", "casefold",
  "startswith", "endswith", "find", "rfind", "zfill", "ljust", "rjust", "center", "partition", "rpartition",
  "encode", "decode", "isdigit", "isalpha", "isalnum", "isspace", "isupper", "islower", "read", "write",
  "readline", "readlines", "writelines", "close", "flush", "seek", "tell", "isoformat", "strftime",
  "strptime", "timestamp", "total_seconds", "date", "time", "now", "today", "utcnow", "fromisoformat",
  "debug", "info", "warning", "warn", "error", "exception", "critical", "log", "group", "groups",
  "groupdict", "match", "search", "fullmatch", "sub", "findall", "finditer", "json", "raise_for_status",
  "hexdigest", "digest", "quantize", "to_dict", "dict", "model_dump", "model_dump_json", "dumps", "loads",
  "dump", "load", "exists", "is_file", "is_dir", "resolve", "with_suffix", "with_name", "relative_to",
  "iterdir", "glob", "rglob", "mkdir", "touch", "submit", "result", "set", "wait", "is_set", "acquire",
  "release", "put", "put_nowait", "get_nowait", "task_done", "start", "cancel", "done", "sleep",
]
# Funciones integradas que no aportan al flujo (se marcan como librería).
integradas_ignoradas = [
  "print", "len", "isinstance", "issubclass", "hasattr", "getattr", "setattr", "delattr", "range",
  "enumerate", "zip", "map", "filter", "sorted", "reversed", "min", "max", "sum", "any", "all", "abs",
  "round", "int", "float", "str", "bool", "bytes", "bytearray", "list", "dict", "set", "frozenset",
  "tuple", "type", "id", "hash", "repr", "format", "iter", "next", "super", "object", "vars", "dir",
  "callable", "chr", "ord", "hex", "oct", "bin", "divmod", "pow", "slice", "property", "staticmethod",
  "classmethod", "locals", "globals", "memoryview", "complex", "ascii", "aiter", "anext", "breakpoint",
]

[entradas]
# Archivos que suelen ser el punto de entrada (suman puntaje).
archivos_principales = [
  "main.py", "__main__.py", "app.py", "run.py", "manage.py", "cli.py", "server.py", "start.py",
  "wsgi.py", "asgi.py", "application.py", "principal.py", "inicio.py", "bot.py", "worker.py",
]
# Funciones que, por nombre, son candidatas a punto de entrada.
funciones_principales = ["main", "principal", "run", "cli", "start", "iniciar", "ejecutar"]
# Decoradores de rutas web: @app.get("/x"), @router.post(...), @app.route("/x", methods=[...]).
metodos_rutas = ["get", "post", "put", "delete", "patch", "head", "options", "trace", "route",
                 "api_route", "websocket", "api_view", "view"]
# Tipos (de librerías) que son aplicaciones web o routers.
clases_app = [
  "fastapi.FastAPI", "fastapi.APIRouter", "fastapi.routing.APIRouter", "flask.Flask", "flask.Blueprint",
  "quart.Quart", "quart.Blueprint", "sanic.Sanic", "sanic.Blueprint", "starlette.applications.Starlette",
  "starlette.routing.Router", "aiohttp.web.Application", "aiohttp.web.RouteTableDef", "litestar.Litestar",
  "litestar.Router", "falcon.App", "falcon.API", "bottle.Bottle", "chalice.Chalice", "connexion.App",
  "connexion.FlaskApp", "connexion.AsyncApp",
]
# Decoradores de tareas asíncronas / colas (celery, dramatiq, rq, huey).
decoradores_tareas = ["task", "shared_task", "periodic_task", "actor", "job", "db_task", "db_periodic_task"]
# Decoradores de comandos de consola (click, typer, invoke).
decoradores_cli = ["command", "group", "callback"]
# Funciones de AWS Lambda / Azure Functions / Google Cloud Functions.
funciones_serverless = ["lambda_handler", "handler", "main_handler"]

